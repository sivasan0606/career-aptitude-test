<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Jumble Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .game-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
        }

        .score-container {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #8e44ad;
        }

        .jumbled-word {
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 20px 0;
            color: #3498db;
            word-wrap: break-word;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background-color: #3498db;
            color: #fff;
        }

        .hint-container {
            margin-top: 15px;
            min-height: 50px;
        }

        #hint-text {
            font-style: italic;
            color: #666;
            margin-top: 10px;
            display: none;
        }

        .btn-action {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
        }

        .btn-action:hover {
            background-color: #27ae60;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }

        .correct {
            color: #27ae60;
        }

        .wrong {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Word Jumble</h1>
        <div class="score-container">Score: <span id="score">0</span></div>
        <div id="jumbled-word" class="jumbled-word">LOADING...</div>

        <div class="options-container" id="options">
            <!-- Options will be injected here -->
        </div>

        <div class="hint-container">
            <button class="btn-action" id="hint-btn">Show Hint</button>
            <p id="hint-text"></p>
        </div>

        <div id="message"></div>
        <button class="btn-action" id="next-btn" style="display: none;">Next Word</button>
    </div>

    <script>
        const wordList = [
            { word: "apple", hint: "A common red or green fruit" },
            { word: "banana", hint: "A long yellow fruit" },
            { word: "elephant", hint: "The largest land animal" },
            { word: "computer", hint: "An electronic device for processing data" },
            { word: "ocean", hint: "A large body of salt water" },
            { word: "guitar", hint: "A musical instrument with strings" },
            { word: "mountain", hint: "A large natural elevation of the earth" },
            { word: "jupiter", hint: "The largest planet in our solar system" },
            { word: "diamond", hint: "A precious stone made of carbon" },
            { word: "library", hint: "A place where books are kept" }
        ];

        function jumbleWord(word) {
            let letters = word.split('');
            for (let i = letters.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            // Ensure jumbled word is not same as original
            if (letters.join('') === word && word.length > 1) {
                return jumbleWord(word);
            }
            return letters.join('');
        }

        let currentWord = "";
        let score = 0;

        function getRandomWord() {
            return wordList[Math.floor(Math.random() * wordList.length)];
        }

        function generateOptions(correctAnswer) {
            let options = [correctAnswer];
            while (options.length < 4) {
                let randomWord = wordList[Math.floor(Math.random() * wordList.length)].word;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }
            // Shuffle options
            for (let i = options.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options;
        }

        function handleSelection(selectedWord, correctWord) {
            const messageEl = document.getElementById("message");
            const nextBtn = document.getElementById("next-btn");
            const optionButtons = document.querySelectorAll(".option-btn");

            optionButtons.forEach(btn => btn.disabled = true);

            if (selectedWord === correctWord) {
                score += 10;
                document.getElementById("score").innerText = score;
                messageEl.innerText = "Correct! +10 points";
                messageEl.className = "correct";
            } else {
                messageEl.innerText = `Wrong! The correct word was ${correctWord.toUpperCase()}.`;
                messageEl.className = "wrong";
            }

            nextBtn.style.display = "inline-block";
        }

        function initGame() {
            const wordData = getRandomWord();
            currentWord = wordData.word;
            const jumbled = jumbleWord(currentWord);
            const options = generateOptions(currentWord);

            document.getElementById("jumbled-word").innerText = jumbled;
            document.getElementById("hint-text").innerText = `Hint: ${wordData.hint}`;
            document.getElementById("hint-text").style.display = "none";
            document.getElementById("message").innerText = "";
            document.getElementById("next-btn").style.display = "none";

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => handleSelection(opt, currentWord);
                optionsContainer.appendChild(btn);
            });
        }

        document.getElementById("hint-btn").onclick = () => {
            document.getElementById("hint-text").style.display = "block";
        };

        document.getElementById("next-btn").onclick = initGame;

        window.onload = initGame;
    </script>
</body>
</html>
