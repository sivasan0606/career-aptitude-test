<!DOCTYPE html>
<html>
<head>
  <title>Career Aptitude Test</title>
  <style>  
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #eef2f3, #ffffff);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .page-wrapper {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 100vh;
    width: 100%;
    max-width: 800px;
    padding: 20px;
  }

  .container {
    background-color: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    flex-grow: 1;
  }

  h2 {
    text-align: center;
    color: #34495e;
    margin-bottom: 30px;
    font-size: 28px;
  }

  .question {
    margin-bottom: 20px;
    padding: 15px;
    background-color: #f7f9fa;
    border-left: 5px solid #3498db;
    border-radius: 6px;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 10px;
    color: #2c3e50;
  }

  input[type="radio"] {
    margin-right: 8px;
    margin-left: 10px;
  }

  .button-wrapper {
    text-align: center;
    margin-top: 20px;
  }

  button {
    padding: 12px 30px;
    font-size: 16px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #2980b9;
  }

  .result {
    margin-top: 30px;
    padding: 25px;
    background-color: #eafaf1;
    border-left: 5px solid #2ecc71;
    border-radius: 6px;
    color: #2c3e50;
    font-weight: 500;
    white-space: pre-line;
  }
  </style>
</head>
<body>
  <h2>Career Aptitude Test (Age 10–45)</h2>
  <form id="careerForm"></form>
  <button type="button" onclick="calculateCareer()">Submit</button>
  <div class="result" id="result"></div>

  <script>
    const traits = ["analytical", "creative", "social", "enterprising", "realistic", "conventional"];
    const questionsPool = [
      { q: "You enjoy finding the best deals when shopping.", t: "analytical" },
			{ q: "You like creating comic strips.", t: "creative" },
			{ q: "You enjoy organizing group activities.", t: "social" },
			{ q: "You like convincing others to try your ideas.", t: "enterprising" },
			{ q: "You enjoy working with wood.", t: "realistic" },
			{ q: "You like updating your calendar regularly.", t: "conventional" },
			{ q: "You enjoy solving Sudoku puzzles.", t: "analytical" },
			{ q: "You like designing clothes.", t: "creative" },
			{ q: "You enjoy helping classmates understand homework.", t: "social" },
			{ q: "You like organizing fundraisers.", t: "enterprising" },
			{ q: "You enjoy fixing bikes.", t: "realistic" },
			{ q: "You like checking your work for neatness.", t: "conventional" },
			{ q: "You enjoy analyzing how machines are built.", t: "analytical" },
			{ q: "You like experimenting with color combinations.", t: "creative" },
			{ q: "You enjoy mentoring younger students.", t: "social" },
			{ q: "You like running for leadership positions.", t: "enterprising" },
			{ q: "You enjoy practicing survival skills outdoors.", t: "realistic" },
			{ q: "You like following daily routines.", t: "conventional" },
			{ q: "You enjoy solving detective-style puzzles.", t: "analytical" },
			{ q: "You like making handmade greeting cards.", t: "creative" },
			{ q: "You enjoy comforting others when they’re sad.", t: "social" },
			{ q: "You like managing group projects.", t: "enterprising" },
			{ q: "You enjoy using pliers for repairs.", t: "realistic" },
			{ q: "You like organizing digital files.", t: "conventional" },
			{ q: "You enjoy reading about space.", t: "analytical" },
			{ q: "You like composing short songs.", t: "creative" },
			{ q: "You enjoy helping at school events.", t: "social" },
			{ q: "You like planning product launches.", t: "enterprising" },
			{ q: "You enjoy assembling electronic kits.", t: "realistic" },
			{ q: "You like keeping your notes organized.", t: "conventional" },
			{ q: "You enjoy reading about inventions.", t: "analytical" },
			{ q: "You like creating digital artwork.", t: "creative" },
			{ q: "You enjoy participating in support groups.", t: "social" },
			{ q: "You like presenting ideas to an audience.", t: "enterprising" },
			{ q: "You enjoy working with your hands outdoors.", t: "realistic" },
			{ q: "You like checking off completed tasks.", t: "conventional" },
			{ q: "You enjoy solving math equations.", t: "analytical" },
			{ q: "You like making stop-motion videos.", t: "creative" },
			{ q: "You enjoy motivating others.", t: "social" },
			{ q: "You like organizing teams for tasks.", t: "enterprising" },
			{ q: "You enjoy repairing household items.", t: "realistic" },
			{ q: "You like sorting items by size.", t: "conventional" },
			{ q: "You enjoy learning how the brain works.", t: "analytical" },
			{ q: "You like designing board games.", t: "creative" },
			{ q: "You enjoy volunteering at shelters.", t: "social" },
			{ q: "You like creating business plans.", t: "enterprising" },
			{ q: "You enjoy using measuring tools.", t: "realistic" },
			{ q: "You like keeping your locker organized.", t: "conventional" },
			{ q: "You enjoy analyzing sports data.", t: "analytical" },
			{ q: "You like decorating for events.", t: "creative" },
			{ q: "You enjoy solving math puzzles.", t: "analytical" },
			{ q: "You enjoy drawing detailed designs.", t: "creative" },
			{ q: "You enjoy helping friends solve problems.", t: "social" },
			{ q: "You like leading group activities.", t: "enterprising" },
			{ q: "You enjoy building things with your hands.", t: "realistic" },
			{ q: "You like organizing your schedule.", t: "conventional" },
			{ q: "You enjoy experimenting with science kits.", t: "analytical" },
			{ q: "You enjoy writing short stories.", t: "creative" },
			{ q: "You like helping in your community.", t: "social" },
			{ q: "You enjoy selling products to others.", t: "enterprising" },
			{ q: "You enjoy working with machines.", t: "realistic" },
			{ q: "You like keeping your desk tidy.", t: "conventional" },
			{ q: "You enjoy solving logic puzzles.", t: "analytical" },
			{ q: "You like making DIY crafts.", t: "creative" },
			{ q: "You enjoy listening and giving advice.", t: "social" },
			{ q: "You like organizing school events.", t: "enterprising" },
			{ q: "You enjoy gardening regularly.", t: "realistic" },
			{ q: "You like following instructions step-by-step.", t: "conventional" },
			{ q: "You enjoy learning how machines work.", t: "analytical" },
			{ q: "You like performing on stage.", t: "creative" },
			{ q: "You enjoy working in teams.", t: "social" },
			{ q: "You like taking charge during projects.", t: "enterprising" },
			{ q: "You enjoy fixing broken items.", t: "realistic" },
			{ q: "You like organizing paperwork.", t: "conventional" },
			{ q: "You enjoy solving science mysteries.", t: "analytical" },
			{ q: "You like designing posters.", t: "creative" },
			{ q: "You enjoy comforting upset friends.", t: "social" },
			{ q: "You like thinking of new business ideas.", t: "enterprising" }
			    ];

    const careers = {
      analytical: [
        { name: "Financial Analyst", desc: "Analyzes market trends and financial data to guide investment decisions. Works with spreadsheets and reports. Ideal for those who enjoy numbers and logic. Often employed in banks, firms, or startups." },
        { name: "Data Scientist", desc: "Uses statistics and coding to find patterns in data. Helps companies make smart decisions. Great for curious minds who enjoy solving complex problems. Often works in tech or research." },
        { name: "Actuary", desc: "Calculates risk using math and statistics. Helps insurance and finance companies plan for the future. Ideal for detail-oriented thinkers. Requires strong math skills." }
      ],
      creative: [
        { name: "Graphic Designer", desc: "Creates visuals for websites, ads, and brands. Uses tools like Photoshop and Illustrator. Perfect for imaginative minds. Often works in media or marketing." },
        { name: "Animator", desc: "Brings characters and stories to life through motion. Works in film, games, or education. Great for artistic kids who love storytelling. Requires drawing and tech skills." },
        { name: "Architect", desc: "Designs buildings and spaces. Combines creativity with engineering. Ideal for visual thinkers. Works with clients and construction teams." }
      ],
      social: [
        { name: "Teacher", desc: "Guides students in learning and growth. Works in schools or tutoring centers. Ideal for patient and caring individuals. Requires strong communication skills." },
        { name: "Counselor", desc: "Helps people manage emotions and decisions. Works in schools, clinics, or NGOs. Great for empathetic listeners. Requires psychology knowledge." },
        { name: "Social Worker", desc: "Supports families and communities in need. Works with government or NGOs. Ideal for compassionate and responsible individuals. Often involves field visits." }
      ],
      enterprising: [
        { name: "Entrepreneur", desc: "Starts and runs businesses. Takes risks and builds ideas into reality. Ideal for bold and strategic thinkers. Requires leadership and planning." },
        { name: "Marketing Strategist", desc: "Promotes products and ideas creatively. Works in advertising or branding. Great for persuasive and energetic minds. Combines creativity with business." },
        { name: "HR Manager", desc: "Manages people and teams in companies. Handles hiring, training, and culture. Ideal for organized and people-focused individuals. Works in all industries." }
      ],
      realistic: [
        { name: "Mechanic", desc: "Repairs vehicles and machines. Works with tools and hands. Ideal for practical thinkers. Often employed in workshops or service centers." },
        { name: "Chef", desc: "Prepares meals and creates recipes. Works in restaurants or hotels. Great for creative hands-on learners. Requires speed and precision." },
        { name: "Electrician", desc: "Installs and fixes electrical systems. Works in homes, offices, and factories. Ideal for detail-oriented and safety-conscious individuals. Requires technical training." }
      ],
      conventional: [
        { name: "Accountant", desc: "Manages financial records and budgets. Works with numbers and spreadsheets. Ideal for organized and detail-focused minds. Employed in firms or businesses." },
        { name: "Tax Consultant", desc: "Helps people and companies with tax planning. Understands laws and deductions. Great for rule-followers and planners. Works independently or in firms." },
        { name: "Bank Officer", desc: "Handles customer accounts and financial services. Works in banks or financial institutions. Ideal for responsible and structured individuals. Requires accuracy and trust." }
      ]
    };

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("careerForm");
      const selectedQuestions = shuffle([...questionsPool]).slice(0, 20);
      selectedQuestions.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `<label>${index + 1}. ${item.q}</label><br>
          <input type="radio" name="q${index}" value="${item.t}"> Yes<br>
          <input type="radio" name="q${index}" value="none"> No<br>`;
        form.appendChild(div);
      });
    });

    function calculateCareer() {
      const form = document.forms['careerForm'];
      const scores = { analytical: 0, creative: 0, social: 0, enterprising: 0, realistic: 0, conventional: 0 };

      for (let i = 0; i < 20; i++) {
        const q = form['q' + i];
        if (q && q.value !== "none") scores[q.value]++;
      }

      const sortedTraits = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const topTraits = sortedTraits.slice(0, 1).map(t => t[0]);
      const personalitySummary = {
        analytical: "You are logical, curious, and enjoy solving problems.",
        creative: "You are imaginative, expressive, and love bringing ideas to life.",
        social: "You are empathetic, communicative, and enjoy helping others.",
        enterprising: "You are confident, persuasive, and enjoy leading and building.",
        realistic: "You are practical, hands-on, and enjoy working with tools or nature.",
        conventional: "You are organized, detail-oriented, and enjoy structure and rules."
      };

      let resultText = `Personality Insight:\n${personalitySummary[topTraits[0]]}\n\nSuggested Careers:\n`;
      careers[topTraits[0]].forEach(c => {
        resultText += `\n🔹 ${c.name}\n${c.desc}\n`;
      });

      document.getElementById('result').innerText = resultText;
    }
  </script>
<div class="page-wrapper">
    <div class="container">
      <h2>Career Aptitude Test (Age 10–45)</h2>
      <form id="careerForm"></form>
    </div>
    <div class="button-wrapper">
      <button type="button" onclick="calculateCareer()">Submit</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</body>
</html>
