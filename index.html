    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

      const selectedQuestions = shuffle([...questionsPool]).slice(0, 20);
      selectedQuestions.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "question";

        form.appendChild(div);
      });

    function calculateCareer() {
      const form = document.forms['careerForm'];
      const scores = { analytical: 0, creative: 0, social: 0, enterprising: 0, realistic: 0, conventional: 0 };

      for (let i = 0; i < 20; i++) {
        const q = form['q' + i];
        if (q && q.value !== "none") scores[q.value]++;
      }

      const sortedTraits = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const topTraits = sortedTraits.slice(0, 1).map(t => t[0]);
