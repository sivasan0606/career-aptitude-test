<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMTC Live Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        .search-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 320px;
        }
        .search-container h2 {
            margin: 0 0 20px 0;
            color: #00529b;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #edf2f7;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00529b;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00529b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #003d73;
        }
        button:active {
            transform: scale(0.98);
        }
        .results {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #eee;
            padding-top: 10px;
            display: none;
        }
        .route-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            margin-bottom: 5px;
            background: #f8fafc;
        }
        .route-item:hover {
            border-color: #00529b;
            background: #eef6ff;
        }
        .route-item strong {
            color: #00529b;
            font-size: 1.1rem;
        }
        .route-item p {
            margin: 4px 0 0 0;
            font-size: 0.8rem;
            color: #555;
        }
        .status {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        @media (max-width: 480px) {
            .search-container {
                width: calc(100% - 40px);
                left: 20px;
                top: 10px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>🚌 BMTC Tracker</h2>
        <div class="input-group">
            <label for="busNo">Bus Number</label>
            <input type="text" id="busNo" placeholder="e.g. 500D, 335E" autocomplete="off">
        </div>
        <div style="text-align: center; margin-bottom: 15px; color: #aaa; font-size: 0.8rem;">— OR —</div>
        <div class="input-group">
            <label for="from">From</label>
            <input type="text" id="from" placeholder="e.g. Majestic, Silk Board" autocomplete="off">
        </div>
        <div class="input-group">
            <label for="to">To</label>
            <input type="text" id="to" placeholder="e.g. Whitefield, Hebbal" autocomplete="off">
        </div>
        <button id="searchBtn">Search & Track</button>

        <div id="status" class="status"></div>
        <div id="results" class="results"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const routes = [
            {
                no: '500D',
                path: [
                    { name: "Hebbal", lat: 13.0423, lng: 77.5861 },
                    { name: "Manyata Tech Park", lat: 13.0451, lng: 77.6204 },
                    { name: "Tin Factory", lat: 13.0022, lng: 77.6816 },
                    { name: "K.R. Puram", lat: 13.0012, lng: 77.6762 },
                    { name: "Marathahalli", lat: 12.9574, lng: 77.6947 },
                    { name: "Bellandur", lat: 12.9272, lng: 77.6704 },
                    { name: "Silk Board", lat: 12.9173, lng: 77.6228 },
                    { name: "Banashankari", lat: 12.9156, lng: 77.5736 }
                ]
            },
            {
                no: '335E',
                path: [
                    { name: "Majestic", lat: 12.9772, lng: 77.5709 },
                    { name: "Corporation", lat: 12.9681, lng: 77.5866 },
                    { name: "Domlur", lat: 12.9610, lng: 77.6387 },
                    { name: "Indiranagar", lat: 12.9623, lng: 77.6458 },
                    { name: "Marathahalli", lat: 12.9574, lng: 77.6947 },
                    { name: "Brookefield", lat: 12.9644, lng: 77.7121 },
                    { name: "Whitefield", lat: 12.9695, lng: 77.7495 },
                    { name: "Kadugodi", lat: 12.9954, lng: 77.7591 }
                ]
            },
            {
                no: '201G',
                path: [
                    { name: "KHS Junction", lat: 12.9403, lng: 77.5458 },
                    { name: "Jayanagar", lat: 12.9307, lng: 77.5832 },
                    { name: "BTM Layout", lat: 12.9166, lng: 77.6101 },
                    { name: "Silk Board", lat: 12.9173, lng: 77.6228 },
                    { name: "HSR Layout", lat: 12.9141, lng: 77.6411 },
                    { name: "Domlur", lat: 12.9610, lng: 77.6387 }
                ]
            },
            {
                no: '276',
                path: [
                    { name: "Majestic", lat: 12.9772, lng: 77.5709 },
                    { name: "Malleshwaram", lat: 12.9972, lng: 77.5711 },
                    { name: "Yeshwanthpur", lat: 13.0235, lng: 77.5562 },
                    { name: "BEL Circle", lat: 13.0315, lng: 77.5612 },
                    { name: "Vidyaranyapura", lat: 13.0766, lng: 77.5574 }
                ]
            },
            {
                no: 'V-500EB',
                path: [
                    { name: "Electronic City", lat: 12.8452, lng: 77.6632 },
                    { name: "Silk Board", lat: 12.9173, lng: 77.6228 },
                    { name: "Marathahalli", lat: 12.9574, lng: 77.6947 },
                    { name: "Tin Factory", lat: 13.0022, lng: 77.6816 },
                    { name: "Hebbal", lat: 13.0423, lng: 77.5861 }
                ]
            },
            {
                no: 'KIA-8H',
                path: [
                    { name: "Sarjapur", lat: 12.8624, lng: 77.7816 },
                    { name: "Dommasandra", lat: 12.8735, lng: 77.7471 },
                    { name: "Carmelaram", lat: 12.9123, lng: 77.7126 },
                    { name: "Wipro Gate", lat: 12.9122, lng: 77.6841 },
                    { name: "Bellandur", lat: 12.9272, lng: 77.6704 },
                    { name: "Marathahalli", lat: 12.9574, lng: 77.6947 },
                    { name: "Tin Factory", lat: 13.0022, lng: 77.6816 },
                    { name: "Hebbal", lat: 13.0423, lng: 77.5861 },
                    { name: "KIA Airport", lat: 13.1986, lng: 77.7066 }
                ]
            }
        ];

        let map, busMarker, polyline, stopMarkers = [];
        let animationInterval;

        function initMap() {
            map = L.map('map').setView([12.9789, 77.5917], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        }

        function clearMap() {
            if (polyline) map.removeLayer(polyline);
            if (busMarker) map.removeLayer(busMarker);
            stopMarkers.forEach(m => map.removeLayer(m));
            stopMarkers = [];
            if (animationInterval) clearInterval(animationInterval);
        }

        function showRoute(route) {
            clearMap();
            const latlngs = route.path.map(p => [p.lat, p.lng]);
            polyline = L.polyline(latlngs, {color: '#00529b', weight: 4, opacity: 0.7}).addTo(map);

            route.path.forEach(p => {
                const marker = L.circleMarker([p.lat, p.lng], {
                    radius: 5,
                    fillColor: "#fff",
                    color: "#00529b",
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(p.name);
                stopMarkers.push(marker);
            });

            map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
            startAnimation(route.path);

            const status = document.getElementById('status');
            status.className = 'status success';
            status.innerText = `Tracking Bus ${route.no} live...`;
            status.style.display = 'block';
        }

        function startAnimation(points) {
            const busIcon = L.divIcon({
                html: '<div style="background-color: #f39c12; width: 22px; height: 22px; border-radius: 4px; border: 2px solid white; box-shadow: 0 0 8px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: bold;">🚌</div>',
                className: 'bus-icon',
                iconSize: [22, 22]
            });

            busMarker = L.marker([points[0].lat, points[0].lng], {icon: busIcon}).addTo(map);

            let step = 0;
            let currentIdx = 0;
            const stepsPerSegment = 150;

            animationInterval = setInterval(() => {
                step++;
                if (step >= stepsPerSegment) {
                    step = 0;
                    currentIdx++;
                    if (currentIdx >= points.length - 1) currentIdx = 0;
                }

                const start = points[currentIdx];
                const end = points[currentIdx + 1];

                const lat = start.lat + (end.lat - start.lat) * (step / stepsPerSegment);
                const lng = start.lng + (end.lng - start.lng) * (step / stepsPerSegment);

                busMarker.setLatLng([lat, lng]);
            }, 30);
        }

        document.getElementById('searchBtn').onclick = () => {
            const busNo = document.getElementById('busNo').value.trim().toUpperCase();
            const from = document.getElementById('from').value.trim().toLowerCase();
            const to = document.getElementById('to').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('results');
            const status = document.getElementById('status');

            resultsDiv.innerHTML = '';
            resultsDiv.style.display = 'none';
            status.style.display = 'none';

            if (busNo) {
                const route = routes.find(r => r.no === busNo);
                if (route) {
                    showRoute(route);
                } else {
                    status.className = 'status error';
                    status.innerText = 'Bus number not found.';
                    status.style.display = 'block';
                }
            } else if (from && to) {
                const foundRoutes = routes.filter(r => {
                    const fromIdx = r.path.findIndex(p => p.name.toLowerCase().includes(from));
                    const toIdx = r.path.findIndex(p => p.name.toLowerCase().includes(to));
                    return fromIdx !== -1 && toIdx !== -1 && fromIdx < toIdx;
                });

                if (foundRoutes.length > 0) {
                    resultsDiv.style.display = 'block';
                    foundRoutes.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'route-item';
                        div.innerHTML = `<strong>${r.no}</strong><p>${r.path[0].name} ➔ ${r.path[r.path.length-1].name}</p>`;
                        div.onclick = () => showRoute(r);
                        resultsDiv.appendChild(div);
                    });
                } else {
                    status.className = 'status error';
                    status.innerText = 'No buses found for this journey.';
                    status.style.display = 'block';
                }
            } else {
                status.className = 'status error';
                status.innerText = 'Please enter Bus No or From & To stations.';
                status.style.display = 'block';
            }
        };

        window.onload = initMap;
    </script>
</body>
</html>
